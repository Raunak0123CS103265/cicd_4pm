


name: Model Training CICD

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Setup CML v2
      - name: Setup CML
        uses: iterative/setup-cml@v2
        with:
          vega: false

      # 4. Install dependencies and train models
      - name: Train model
        run: |
          pip install -r requirements.txt
          python train_model.py

      # 5. Generate CML report
      - name: Create CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# Model Training Results" > report.md

          echo "## Random Forest and Logistic Regression Scores" >> report.md

          cat scores.txt >> report.md

          echo "## Project Status" >> report.md
          echo "Model training completed successfully." >> report.md

          cml comment create report.md

      # 6. Upload generated images and results
      - name: Upload model results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ML-Model-Results
          path: |
            logistic_regression_confusion_matrix.png
            random_forest_confusion_matrix.png
            FeatureImportance.png
            model_comparison.csv
            scores.txt
          if-no-files-found: warn
