
name: Model Training CICD

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup CML
        uses: iterative/setup-cml@v2
        with:
          vega: false

      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt

          python train_model.py

          echo "## RF and LR Model Score" > report.md
          cat scores.txt >> report.md

          echo "## Confusion Matrix & Feature Importance" > report1.md

          echo "![Confusion Matrix](./ConfusionMatrix.png)" >> report1.md
          echo "![Feature Importance](./FeatureImportance.png)" >> report1.md

          cat report.md report1.md > combined_file.md

          cml comment create combined_file.md
