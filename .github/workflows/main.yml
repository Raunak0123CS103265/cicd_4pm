

name: Model Training CICD

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Setup CML v2
      - name: Setup CML
        uses: iterative/setup-cml@v2
        with:
          vega: false

      # 4. Install dependencies, train models and generate reports
      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt

          python train_model.py

          # Model performance report
          echo "## RF and LR Model Score" > report.md
          cat scores.txt >> report.md

          # Confusion matrix and feature importance
          echo "## Confusion Matrix & Feature Importance" > report1.md

          echo "### Confusion Matrix" >> report1.md
          echo "![Confusion Matrix](./ConfusionMatrix.png)" >> report1.md

          echo "### Feature Importance" >> report1.md
          echo "![Feature Importance](./FeatureImportance.png)" >> report1.md

          # Combine reports
          cat report.md report1.md > combined_file.md

          # Publish report on GitHub
          cml comment create combined_file.md
